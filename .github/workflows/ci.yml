name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm scan:secrets
      - run: pnpm audit:prod
      - run: pnpm release:check

      - name: Check Azure shell scripts
        run: bash -n infra/azure/*.sh

      - name: Verify CLI package tarball
        run: pnpm release:cli:pack

      - name: Verify web surface
        run: |
          cd apps/web
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/aipm-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill ${WEB_PID}' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "${WEB_PID}" 2>/dev/null; then
              cat /tmp/aipm-web.log
              exit 1
            fi
            sleep 1
          done
          pnpm verify:local
