name: Deploy registry API to Azure staging

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Azure App Service name"
        required: false
        default: "aipm-registry-staging"
  push:
    branches: [main]
    paths:
      - "apps/registry-api/**"
      - "packages/schemas/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-registry-staging.yml"

env:
  AZURE_WEBAPP_NAME: ${{ inputs.app_name || vars.AZURE_WEBAPP_NAME || 'aipm-registry-staging' }}
  NODE_VERSION: 20
  PNPM_VERSION: 9.15.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm lint

      - name: Create deploy package
        run: pnpm --filter @aipm/registry-api deploy --prod deploy/registry-api

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy/registry-api
