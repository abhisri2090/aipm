services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aipm
      POSTGRES_PASSWORD: aipm
      POSTGRES_DB: aipm
    ports:
      - "5432:5432"
    volumes:
      - aipm_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipm -d aipm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  aipm_pg:
